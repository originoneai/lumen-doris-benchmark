name: Validate benchmark contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for dataset in retail manufacturing logistics subscription wholesale; do
            python3 -m lumen_bench validate "$dataset" || exit $?
          done
